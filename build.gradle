plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
group = 'fi.dy.masa.orecontrol'
version = '1.2.0+mc26.1.2'
base { archivesName = 'orecontrol-fabric' }
repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('COPYING.txt', 'COPYING.LESSER.txt', 'README.md') }

sourceSets {
    integration {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    interfaceInjection { isEnabled = false }
    enableTransitiveAccessWideners = false
    splitEnvironmentSourceSets()
    mods {
        orecontrol { sourceSet sourceSets.main; sourceSet sourceSets.client }
        orecontrol_tests { sourceSet sourceSets.integration }
    }
    runs {
        integrationServer {
            server()
            source sourceSets.integration
            runDir 'build/integration-run'
        }
        regenerationServer {
            server()
            source sourceSets.integration
            runDir 'build/integration-run'
            vmArg '-Dorecontrol.reopenTest=true'
        }
        structureServer {
            server()
            source sourceSets.integration
            runDir 'build/structure-run'
            vmArg '-Dorecontrol.structureTest=true'
        }
    }
}
tasks.named('runRegenerationServer') {
    dependsOn 'runIntegrationServer'
    doFirst { file('build/integration-run/reopen-test-results.txt').delete() }
    doLast {
        def result = file('build/integration-run/reopen-test-results.txt')
        if (!result.exists() || !result.text.contains('REGENERATION_PASSED')) throw new GradleException('World regeneration checks failed')
    }
}
dependencies {
    clientCompileOnly 'com.terraformersmc:modmenu:18.0.2'
    clientRuntimeOnly 'com.terraformersmc:modmenu:18.0.2'
}
sourceSets {
    clientTest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
    }
}
loom {
    mods { orecontrol_client_tests { sourceSet sourceSets.clientTest } }
    runs {
        clientTest {
            client()
            source sourceSets.clientTest
            runDir 'build/client-run'
            programArgs '--width', '1100', '--height', '740'
        }
    }
}
tasks.named('runClientTest') {
    dependsOn 'runRegenerationServer'
    dependsOn 'runStructureServer'
    doFirst {
        def run = file('build/client-run')
        run.mkdirs()
        new File(run, 'client-test-results.txt').delete()
        new File(run, 'options.txt').text = 'lang:zh_cn\nguiScale:2\nautoJump:false\n'
        def config = new File(run, 'config/orecontrol/orecontrol.cfg')
        config.parentFile.mkdirs()
        config.text = ''
        def source = file('build/integration-run').listFiles().findAll { it.directory && it.name.startsWith('world-') }.max { it.lastModified() }
        def name = 'client-test-' + System.currentTimeMillis()
        copy { from source; into new File(run, 'saves/' + name) }
        new File(run, 'test-world-name.txt').text = name
    }
    doLast {
        def result = file('build/client-run/client-test-results.txt')
        if (!result.exists() || !result.text.contains('ALL_CLIENT_CHECKS_PASSED')) throw new GradleException('Client UI checks failed')
    }
}

tasks.named('runStructureServer') {
    doFirst {
        def run = file('build/structure-run')
        run.mkdirs()
        new File(run, 'eula.txt').text = 'eula=true\n'
        new File(run, 'structure-test-results.txt').delete()
        def config = new File(run, 'config/orecontrol/orecontrol.cfg')
        config.parentFile.mkdirs()
        config.text = ''
        def world = 'structures-' + System.currentTimeMillis()
        new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-seed=424242\ngenerate-structures=true\nmax-tick-time=-1\nview-distance=2\nsimulation-distance=2\nlevel-name=' + world + '\n'
        def pack = new File(run, world + '/datapacks/structure-tests')
        def json = { String path, Object value ->
            def target = new File(pack, path)
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.toJson(value)
        }
        json('pack.mcmeta', [pack: [description: 'Ore Control structure fixtures', min_format: [101, 1], max_format: [101, 1]]])
        ['village': 'village_plains', 'mineshaft': 'mineshaft', 'trial': 'trial_chambers'].each { name, structure ->
            json('data/fixtures/worldgen/structure_set/' + name + '.json', [structures: [[structure: 'minecraft:' + structure, weight: 1]], placement: [type: 'minecraft:random_spread', spacing: 32, separation: 8, salt: 10387312]])
            json('data/fixtures/dimension/' + name + '.json', [type: 'minecraft:overworld', generator: [type: 'minecraft:flat', settings: [biome: 'minecraft:plains', features: false, lakes: false, structure_overrides: ['fixtures:' + name], layers: [[height: 1, block: 'minecraft:bedrock'], [height: 124, block: 'minecraft:stone'], [height: 3, block: 'minecraft:dirt'], [height: 1, block: 'minecraft:grass_block']]]]])
        }
    }
    doLast {
        def result = file('build/structure-run/structure-test-results.txt')
        if (!result.exists() || !result.text.contains('ALL_STRUCTURE_CHECKS_PASSED')) throw new GradleException('Structure checks failed')
    }
}
tasks.named('runIntegrationServer') {
    doFirst {
        def run = file('build/integration-run')
        run.mkdirs()
        new File(run, 'eula.txt').text = 'eula=true\n'
        new File(run, 'test-results.txt').delete()
        def worldName = 'world-' + System.currentTimeMillis()
        new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nlevel-seed=424242\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nserver-port=0\nmax-tick-time=-1\nlevel-name=' + worldName + '\n'
        def pack = new File(run, worldName + '/datapacks/orecontrol-tests')
        def json = { String path, Object value ->
            def target = new File(pack, path)
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.toJson(value)
        }
        json('pack.mcmeta', [pack: [description: 'Ore Control generation fixtures', min_format: [101, 1], max_format: [101, 1]]])
        def gameJar = sourceSets.main.runtimeClasspath.files.find { it.name.startsWith('minecraft-common') }
        def zip = new java.util.zip.ZipFile(gameJar)
        try {
            ['jungle': 'bamboo_jungle', 'ocean': 'lukewarm_ocean', 'coral': 'warm_ocean', 'forest': 'forest'].each { name, biome ->
                def data = new groovy.json.JsonSlurper().parseText(zip.getInputStream(zip.getEntry('data/minecraft/worldgen/biome/' + biome + '.json')).text)
                if (name == 'coral') {
                    data.features[9].add('fixtures:dense_pickles')
                    data.features[9].add('fixtures:inline_coral')
                }
                if (name == 'forest') {
                    data.features[9].add('fixtures:vine_tree')
                    data.features[9].add('fixtures:dense_moss')
                }
                json('data/fixtures/worldgen/biome/' + name + '.json', data)
                def layers = [[height: 1, block: 'minecraft:bedrock'], [height: 40, block: 'minecraft:stone']]
                layers += ['jungle', 'forest'].contains(name) ? [[height: 3, block: 'minecraft:dirt'], [height: 1, block: 'minecraft:grass_block']]
                        : [[height: 3, block: 'minecraft:sand'], [height: 12, block: 'minecraft:water']]
                json('data/fixtures/dimension/' + name + '.json', [type: 'minecraft:overworld', generator: [type: 'minecraft:flat', settings: [biome: 'fixtures:' + name, features: true, lakes: false, structure_overrides: [], layers: layers]]])
            }
            def placement = [[type: 'minecraft:count', count: 64], [type: 'minecraft:in_square'], [type: 'minecraft:heightmap', heightmap: 'OCEAN_FLOOR_WG'], [type: 'minecraft:biome']]
            json('data/fixtures/worldgen/placed_feature/dense_pickles.json', [feature: 'minecraft:sea_pickle', placement: placement])
            json('data/fixtures/worldgen/placed_feature/inline_coral.json', [feature: [type: 'minecraft:coral_tree', config: [:]], placement: placement])
            json('data/fixtures/worldgen/placed_feature/dense_moss.json', [feature: 'minecraft:moss_vegetation', placement: [[type: 'minecraft:count', count: 256], [type: 'minecraft:in_square'], [type: 'minecraft:heightmap', heightmap: 'WORLD_SURFACE_WG'], [type: 'minecraft:biome']]])
            json('data/fixtures/worldgen/placed_feature/vine_tree.json', [feature: 'minecraft:jungle_tree', placement: [[type: 'minecraft:count', count: 64], [type: 'minecraft:in_square'], [type: 'minecraft:heightmap', heightmap: 'WORLD_SURFACE_WG'], [type: 'minecraft:biome']]])
        } finally { zip.close() }
    }
    doLast {
        def result = file('build/integration-run/test-results.txt')
        if (!result.exists() || !result.text.contains('PASS: all checks completed')) {
            throw new GradleException('Integration tests failed. See build/integration-run/test-results.txt and integration.log.')
        }
        def target = file('build/integration-run/shutdown-reset-target.txt')
        if (!target.exists()) throw new GradleException('Shutdown reset target was not recorded')
        def region = new RandomAccessFile(new File(target.text.trim()), 'r')
        try {
            region.seek(4L * (8 + 8 * 32))
            if (region.readInt() != 0) throw new GradleException('Shutdown reset did not clear the selected chunk')
            region.seek(4L * (9 + 8 * 32))
            if (region.readInt() == 0) throw new GradleException('Shutdown reset damaged the neighboring chunk')
        } finally { region.close() }
    }
}
