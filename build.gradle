plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
group = 'fi.dy.masa.orecontrol'
version = '0.4.3-port.2+26.1.2'
base { archivesName = 'orecontrol-fabric' }
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('COPYING.txt', 'COPYING.LESSER.txt', 'README.md') }

sourceSets {
    integration {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        orecontrol { sourceSet sourceSets.main }
        orecontrol_tests { sourceSet sourceSets.integration }
    }
    runs {
        integrationServer {
            server()
            source sourceSets.integration
            runDir 'build/integration-run'
        }
    }
}
tasks.named('runIntegrationServer') {
    doFirst {
        def run = file('build/integration-run')
        run.mkdirs()
        new File(run, 'eula.txt').text = 'eula=true\n'
        new File(run, 'test-results.txt').delete()
        new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nlevel-seed=424242\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nserver-port=0\nmax-tick-time=-1\nlevel-name=world-' + System.currentTimeMillis() + '\n'
    }
    doLast {
        def result = file('build/integration-run/test-results.txt')
        if (!result.exists() || !result.text.contains('PASS: all checks completed')) {
            throw new GradleException('Integration tests failed. See build/integration-run/test-results.txt and integration.log.')
        }
    }
}
